
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFA: Infiltrate the Hero's Base</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #090d1b;
    color: #eef2ff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 14px;
  }

  #game {
    width: 100%;
    max-width: 760px;
    align-self: flex-start;
    background: #131a30;
    border: 1px solid #303c60;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 15px 50px #0006;
  }

  h1 { color: #72e7ff; margin-top: 0; }
  h2 { color: #b8c8ff; }
  p { line-height: 1.65; }

  .subtitle { color: #aab7d5; }

  .status {
    display: flex;
    gap: 8px;
    margin: 22px 0;
  }

  .layer {
    flex: 1;
    text-align: center;
    padding: 12px 5px;
    border: 1px solid #384564;
    border-radius: 9px;
    color: #9ba9c8;
    font-size: 13px;
  }

  .layer.active {
    border-color: #72e7ff;
    color: #72e7ff;
    background: #183246;
  }

  .layer.done {
    border-color: #56dfa1;
    color: #56dfa1;
  }

  .panel {
    background: #0b1122;
    border: 1px solid #283654;
    padding: 20px;
    border-radius: 12px;
    margin: 16px 0;
  }

  .hero {
    border-left: 4px solid #72e7ff;
    background: #10243a;
    padding: 16px;
    border-radius: 8px;
    margin: 18px 0;
  }

  .villain {
    border-left: 4px solid #ff718c;
    background: #321927;
    padding: 16px;
    border-radius: 8px;
  }

  .hero strong { color: #72e7ff; }
  .villain strong { color: #ff9db0; }

  input {
    width: 100%;
    padding: 13px;
    background: #171f35;
    border: 1px solid #526184;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    margin: 10px 0;
  }

  button {
    padding: 12px 17px;
    border: 0;
    border-radius: 8px;
    background: #72e7ff;
    color: #091321;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 5px 5px 0;
  }

  button:hover { filter: brightness(1.12); }

  button.secondary {
    background: #34415e;
    color: white;
  }

  button.danger {
    background: #ff718c;
    color: #230710;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: #202b46;
    color: white;
    border: 1px solid #3d4b6d;
    margin: 9px 0;
  }

  .choice:hover { border-color: #72e7ff; }

  #feedback { min-height: 28px; color: #ffb5c2; }
  .success { color: #56dfa1 !important; }
  .muted { color: #aab7d5; font-size: 14px; }
  .big { font-size: 52px; text-align: center; margin: 8px; }
  .hidden { display: none; }

  @media (max-width: 500px) {
    #game { padding: 18px; }
    .status { gap: 5px; }
    .layer { font-size: 11px; }
  }
</style>
</head>

<body>
<main id="game">
  <h1>🦹 MFA: Infiltrate the Base</h1>
  <p class="subtitle">
    Three layers. One villain. One very determined hero.
  </p>

  <div class="status">
    <div class="layer active" id="badge1">🔐 Layer 1<br>Easy</div>
    <div class="layer" id="badge2">🛡️ Layer 2<br>Medium</div>
    <div class="layer" id="badge3">🚨 Layer 3<br>Extreme</div>
  </div>

  <section id="screen"></section>
</main>

<script>
const screen = document.getElementById("screen");

let attempts = 0;
let stage2Puzzle = 0;
let stage3Attempts = 0;

function show(html) {
  screen.innerHTML = html;
}

function updateLayers(current, completed = 0) {
  for (let i = 1; i <= 3; i++) {
    const badge = document.getElementById("badge" + i);
    badge.className = "layer";

    if (i <= completed) badge.classList.add("done");
    if (i === current) badge.classList.add("active");
  }
}

function startGame() {
  attempts = 0;
  stage2Puzzle = 0;
  stage3Attempts = 0;
  updateLayers(1);

  show(`
    <div class="big">🏰</div>
    <h2>Mission: Enter the Hero's Base</h2>
    <div class="villain">
      <strong>Villain:</strong> At last! I'll steal the hero's
      legendary crystal. Surely a door is all that stands in my way!
    </div>
    <p>
      Unfortunately, the hero protects the base with three layers
      of security. Solve the puzzles to discover how authentication
      protects accounts and systems.
    </p>
    <button onclick="layer1()">Begin Infiltration →</button>
  `);
}

// LAYER 1: PASSWORD
function layer1() {
  updateLayers(1);

  show(`
    <h2>🔐 Layer 1: The Password Gate</h2>
    <p>
      A screen appears. You find a note left beside the terminal:
    </p>

    <div class="panel">
      <p><strong>Security clue:</strong></p>
      <p>
        "The password has 8 characters. It contains uppercase
        and lowercase letters, numbers, and a symbol."
      </p>
      <p class="muted">
        Hint: This is a training puzzle. The answer is not a real
        password or a credential for any actual account.
      </p>
    </div>

    <p>Enter the secret training password:</p>
    <input id="password" placeholder="Enter password"
      autocomplete="off" />
    <button onclick="checkPassword()">Unlock Gate</button>
    <p id="feedback"></p>
  `);
}

function checkPassword() {
  const answer = document.getElementById("password").value;

  if (answer === "H3ro!Key") {
    show(`
      <h2 class="success">✅ First Gate Open!</h2>
      <p>You passed the password challenge.</p>

      <div class="hero">
        <strong>🦸 Hero:</strong>
        Not bad, villain. But a password is only one kind of
        security check. If someone steals or guesses it, they
        might get in. That's why I use Multi-Factor Authentication,
        or MFA. It requires two or more different types of
        authentication factors.
      </div>

      <div class="panel">
        <strong>📘 What you learned</strong>
        <ul>
          <li>Passwords are something you know.</li>
          <li>Long, unique passwords are harder to guess.</li>
          <li>A password alone can still be compromised.</li>
        </ul>
      </div>

      <button onclick="layer2()">Approach Layer 2 →</button>
    `);
  } else {
    document.getElementById("feedback").textContent =
      "Access denied! Hint: Inspect Element?";
  }
}

// LAYER 2: TWO PUZZLES
function layer2() {
  stage2Puzzle = 0;
  updateLayers(2, 1);
  puzzleOTP();
}

function puzzleOTP() {
  stage2Puzzle = 1;

  show(`
    <h2>🛡️ Layer 2: The Verification Check</h2>
    <p>
      The password worked, but the hero's second gate requests
      a one-time verification code.
    </p>

    <div class="panel">
      <p><strong>Training challenge:</strong></p>
      <p>Your fictional authenticator displays:</p>
      <div class="big">482731</div>
      <p class="muted">
        This is a simulated code for the game, not a real
        verification code.
      </p>
    </div>

    <input id="otp" placeholder="Enter the 6-digit code"
      inputmode="numeric" maxlength="6" />
    <button onclick="checkOTP()">Verify Code</button>
    <p id="feedback"></p>
  `);
}

function checkOTP() {
  const value = document.getElementById("otp").value;

  if (value === "482731") {
    puzzleFactor();
  } else {
    document.getElementById("feedback").textContent =
      "Incorrect code. Check the training authenticator.";
  }
}

function puzzleFactor() {
  stage2Puzzle = 2;

  show(`
    <h2>🛡️ Layer 2: Puzzle Two — The Second Factor</h2>

    <div class="hero">
      <strong>🦸 Hero:</strong>
      A one-time code adds another check. MFA works best when
      the factors come from different categories. A password
      and a fingerprint are different types of evidence.
    </div>

    <p>
      The gate asks: Which option combines two different
      authentication factor categories?
    </p>

    <button class="choice" onclick="checkFactor(1)">
      A. Password + PIN
    </button>

    <button class="choice" onclick="checkFactor(2)">
      B. Password + Fingerprint
    </button>

    <button class="choice" onclick="checkFactor(3)">
      C. Two different passwords
    </button>

    <button class="choice" onclick="checkFactor(4)">
      D. Username + Email address
    </button>

    <p id="feedback"></p>
  `);
}

function checkFactor(choice) {
  if (choice === 2) {
    show(`
      <h2 class="success">✅ Layer 2 Breached!</h2>
      <p>You solved both puzzles. The next gate is much harder.</p>

      <div class="panel">
        <strong>📘 What you learned</strong>
        <ul>
          <li>Something you know: password or PIN.</li>
          <li>Something you have: security key or authenticator device.</li>
          <li>Something you are: fingerprint or face recognition.</li>
        </ul>
        <p>
          Two passwords are still the same factor category.
          Two-factor authentication (2FA) uses two different
          categories. MFA means two or more factors.
        </p>
      </div>

      <div class="hero">
        <strong>🦸 Hero:</strong>
        You're persistent! But my final defense is designed to
        stop attackers even if they obtain a password or trick
        someone into revealing a code.
      </div>

      <button onclick="layer3()">Face the Final Defense →</button>
    `);
  } else {
    document.getElementById("feedback").textContent =
      "Not quite! Think about which options use different categories.";
  }
}

// LAYER 3: EXTREME CHALLENGE
function layer3() {
  attempts = 0;
  stage3Attempts = 0;
  updateLayers(3, 2);
  puzzleFinal();
}

function puzzleFinal() {
  show(`
    <h2>🚨 Layer 3: The Impossible Firewall</h2>
    <p>
      The final gate combines device verification, a security key,
      and a strict access policy.
    </p>

    <div class="panel">
      <p><strong>Security system status</strong></p>
      <p>🔒 Password: Verified</p>
      <p>🔒 One-time code: Verified</p>
      <p>🔒 Device trust: Required</p>
      <p>🔒 Hardware security key: Required</p>
      <p>🔒 Authorized access policy: Required</p>
    </div>

    <p>
      <strong>Final challenge:</strong> What is the secret recovery
      key that satisfies every check?
    </p>

    <p class="muted">
      The key is intentionally not provided. Guessing cannot
      satisfy the missing security requirements.
    </p>

    <input id="finalAnswer"
      placeholder="Enter the recovery key" autocomplete="off" />

    <button onclick="checkFinal()">Attempt Access</button>
    <button class="danger" onclick="giveUp()">Give Up</button>

    <p id="feedback"></p>
    <p id="attemptCount" class="muted">
      Failed attempts: 0
    </p>
  `);
}

function checkFinal() {
  stage3Attempts++;

  document.getElementById("feedback").textContent =
    "ACCESS DENIED. The required security proof is missing.";

  document.getElementById("attemptCount").textContent =
    "Failed attempts: " + stage3Attempts;

  if (stage3Attempts >= 3) {
    document.getElementById("feedback").textContent =
      "Too many failed attempts! The system has locked the gate.";

    const button = screen.querySelector(
      'button:not(.danger)'
    );
    button.disabled = true;
  }
}

function giveUp() {
  updateLayers(3, 2);

  show(`
    <div class="big">🛑</div>
    <h2>Mission Failed — The Base Remains Secure</h2>

    <div class="villain">
      <strong>Villain:</strong>
      I've tried everything! I know the password and the code,
      but the system still won't let me in!
    </div>

    <div class="hero">
      <strong>🦸 Hero:</strong>
      Exactly! Authentication isn't just about knowing a secret.
      The final gate also checks that you possess the required
      security key, use an approved device, and meet the access
      policy. Without the required proof, you cannot simply
      guess your way in.
    </div>

    <div class="panel">
      <h3>🎓 What this mission taught you</h3>

      <p><strong>1. Passwords are not enough.</strong><br>
      A stolen password can give an attacker a head start.</p>

      <p><strong>2. MFA adds layers of protection.</strong><br>
      Different factors make it harder for an attacker to
      impersonate a legitimate user.</p>

      <p><strong>3. Stronger methods matter.</strong><br>
      Authenticator apps and hardware security keys can offer
      stronger protection than passwords alone. Phishing-resistant
      methods, such as passkeys and security keys, help protect
      against fake login pages.</p>

      <p><strong>4. MFA isn't invincible.</strong><br>
      Attackers can still exploit phishing, stolen sessions,
      compromised devices, or account recovery weaknesses.
      Good security combines MFA with other safeguards.</p>

      <p><strong>5. Access must be verified.</strong><br>
      A secure system checks the required evidence instead of
      trusting someone just because they know a password.</p>
    </div>

    <h2 class="success">🏆 Training Complete!</h2>
    <p>
      You couldn't enter the base, but you've learned why
      multiple authentication factors help protect it.
    </p>

    <button onclick="startGame()">Play Again ↻</button>
  `);
}

startGame();
</script>
</body>
</html>
